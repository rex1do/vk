name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# по одной сборке за раз: две параллельные не должны публиковать один и тот же релиз
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Create release
        # electron-builder заливает установщик и переносную версию одновременно, и каждая загрузка
        # пыталась создать релиз сама — вторая падала. Создаём релиз заранее, загрузки только дополняют его.
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --title "$VERSION" --target "$GITHUB_SHA" --notes "VK Player $VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release
        # каждая сборка из main публикуется как релиз vX.Y.Z — программа при запуске проверяет его
        # и обновляется сама (latest.yml + установщик); версию в package.json поднимаем при каждом выпуске
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: VKPlayer-windows
          path: |
            dist/*.exe
