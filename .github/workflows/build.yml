name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Check imports
        run: python -c "import vkplayer.app, vkplayer.auth"
      - name: Build
        run: pyinstaller --noconfirm --windowed --name VKPlayer --collect-all curl_cffi run.py
      - name: Zip
        run: Compress-Archive -Path dist/VKPlayer -DestinationPath VKPlayer-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VKPlayer-windows
          path: VKPlayer-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VKPlayer-windows.zip
