name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build and publish release
        # каждая сборка из main публикуется как релиз vX.Y.Z — программа при запуске проверяет его
        # и обновляется сама (latest.yml + установщик); версию в package.json поднимаем при каждом выпуске
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: VKPlayer-windows
          path: |
            dist/*.exe
