<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; media-src 'self' https: blob:; connect-src https:; worker-src 'self' blob:; style-src 'self'; script-src 'self'">
  <title>VK Player</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <!-- Фон: размытая обложка текущего трека -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient-layer" id="ambient-a"></div>
    <div class="ambient-layer" id="ambient-b"></div>
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
    <div class="ambient-shade"></div>
  </div>

  <div class="app">
    <header class="titlebar drag">
      <div class="brand">
        <img src="../build/icon.png" alt="" class="brand-icon">
        <span class="label brand-name">VK Player</span>
      </div>
      <div class="history">
        <button class="icon-btn" id="back" title="Назад (Alt+←)" disabled>
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="icon-btn" id="forward" title="Вперёд (Alt+→)" disabled>
          <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="search-wrap" id="search-wrap">
        <form class="search glass" id="search-form" autocomplete="off">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
          <input id="search" type="search" placeholder="Трек, артист, альбом" spellcheck="false">
        </form>
        <div class="suggest glass" id="suggest" hidden></div>
      </div>
      <div class="window-buttons" id="window-buttons">
        <button class="win-btn" data-window="minimize" title="Свернуть">
          <svg viewBox="0 0 24 24"><path d="M6.5 12h11"/></svg>
        </button>
        <button class="win-btn" data-window="maximize" title="Развернуть">
          <svg viewBox="0 0 24 24" class="max-icon"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg>
          <svg viewBox="0 0 24 24" class="restore-icon"><rect x="6.5" y="8.5" width="9" height="9" rx="1.5"/><path d="M9 8.5V7.5A1 1 0 0 1 10 6.5h6.5A1 1 0 0 1 17.5 7.5V14a1 1 0 0 1-1 1h-1"/></svg>
        </button>
        <button class="win-btn close" data-window="close" title="Закрыть (свернуть в трей)">
          <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
    </header>

    <aside class="sidebar heavy">
      <nav>
        <div class="nav-caption">Музыка</div>
        <button class="item" data-route="home" title="Обзор">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path class="fill" d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span class="label">Обзор</span>
        </button>
        <button class="item" data-route="my" title="Моя музыка">
          <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span class="label">Моя музыка</span>
        </button>
        <button class="item" data-route="recs" title="Для вас">
          <svg viewBox="0 0 24 24"><path class="fill" d="M11 3q1 7 8 8q-7 1-8 8q-1-7-8-8q7-1 8-8z"/></svg><span class="label">Для вас</span>
        </button>
        <button class="item" data-route="playlists" title="Плейлисты">
          <svg viewBox="0 0 24 24"><path d="M4 6h12M4 11h12M4 16h7"/><path class="fill" d="M14.5 13.5l6 3.5-6 3.5z"/></svg><span class="label">Плейлисты</span>
        </button>
        <div class="nav-caption">Открыть новое</div>
        <button class="item" data-route="chart" title="Чарт">
          <svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-9"/></svg><span class="label">Чарт</span>
        </button>
        <button class="item" data-route="new" title="Новинки">
          <svg viewBox="0 0 24 24"><path d="M12 4v4M12 16v4M4 12h4M16 12h4M6.3 6.3l2.8 2.8M14.9 14.9l2.8 2.8M6.3 17.7l2.8-2.8M14.9 9.1l2.8-2.8"/></svg><span class="label">Новинки</span>
        </button>
      </nav>

      <div class="account" id="account">
        <button class="item login-item" id="login-btn" title="Войти во ВКонтакте">
          <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></svg><span class="label">Войти</span>
        </button>
        <div class="user" id="user" hidden>
          <img class="avatar" id="user-avatar" alt="">
          <span class="label user-name" id="user-name"></span>
          <button class="icon-btn small label" id="logout-btn" title="Выйти из аккаунта">
            <svg viewBox="0 0 24 24"><path d="M14 17l5-5-5-5M19 12H8M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="content" id="content">
      <div class="view" id="view"></div>
    </main>

    <footer class="player glass idle" id="player">
      <div class="track" id="bar-track" title="Открыть плеер">
        <div class="cover" id="bar-cover"><img alt=""></div>
        <div class="meta">
          <div class="title" id="bar-title">Ничего не играет</div>
          <div class="artist" id="bar-artist">Выберите трек</div>
        </div>
      </div>

      <div class="center">
        <div class="controls">
          <button class="icon-btn toggle" data-act="shuffle" title="Перемешать">
            <svg viewBox="0 0 24 24"><path d="M3 17h3c5 0 6-10 11-10h3.5M3 7h3c5 0 6 10 11 10h3.5"/><path d="M18 4.5l2.5 2.5L18 9.5M18 14.5l2.5 2.5-2.5 2.5"/></svg>
          </button>
          <button class="icon-btn" data-act="prev" title="Предыдущий">
            <svg viewBox="0 0 24 24"><path class="fill" d="M19 5L8.5 12 19 19z"/><rect class="fill" x="4.9" y="5" width="2.6" height="14" rx="1.2"/></svg>
          </button>
          <button class="play" data-act="toggle" title="Играть / пауза (пробел)">
            <svg viewBox="0 0 24 24" class="icon-play"><path class="fill" d="M8 5l11.5 7L8 19z"/></svg>
            <svg viewBox="0 0 24 24" class="icon-pause"><rect class="fill" x="6" y="5" width="4" height="14" rx="1.2"/><rect class="fill" x="14" y="5" width="4" height="14" rx="1.2"/></svg>
          </button>
          <button class="icon-btn" data-act="next" title="Следующий">
            <svg viewBox="0 0 24 24"><path class="fill" d="M5 5l10.5 7L5 19z"/><rect class="fill" x="16.5" y="5" width="2.6" height="14" rx="1.2"/></svg>
          </button>
          <button class="icon-btn toggle repeat" data-act="repeat" title="Повтор">
            <svg viewBox="0 0 24 24"><path d="M4 12v-1.5A3.5 3.5 0 0 1 7.5 7h12M17 4.5L19.5 7 17 9.5M20 12v1.5a3.5 3.5 0 0 1-3.5 3.5h-12M7 14.5L4.5 17 7 19.5"/></svg>
            <span class="repeat-one">1</span>
          </button>
        </div>
        <div class="progress">
          <span class="time" data-bind="pos">0:00</span>
          <input type="range" class="seek" min="0" max="1000" value="0" aria-label="Перемотка">
          <span class="time" data-bind="dur">0:00</span>
        </div>
      </div>

      <div class="right">
        <button class="icon-btn add-btn" data-act="add" title="Добавить в Мои аудио"><svg viewBox="0 0 24 24" class="ic-add"><path d="M12 5v14M5 12h14"/></svg><svg viewBox="0 0 24 24" class="ic-added"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
        <button class="icon-btn" data-act="download" title="Скачать трек"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/></svg></button>
        <button class="icon-btn" id="eq-btn" title="Эквалайзер"><svg viewBox="0 0 24 24"><path d="M6 4v16M12 4v16M18 4v16"/><circle cx="6" cy="14" r="2.2" class="fill"/><circle cx="12" cy="8" r="2.2" class="fill"/><circle cx="18" cy="15" r="2.2" class="fill"/></svg></button>
        <div class="volume">
          <button class="icon-btn mute" title="Без звука">
            <svg viewBox="0 0 24 24" class="vol-on"><path class="fill" d="M3.5 9h4l5-4.5v15l-5-4.5h-4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>
            <svg viewBox="0 0 24 24" class="vol-off"><path class="fill" d="M3.5 9h4l5-4.5v15l-5-4.5h-4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
          </button>
          <input type="range" class="vol" min="0" max="100" value="80" aria-label="Громкость">
        </div>
        <button class="icon-btn" id="expand" title="Развернуть плеер">
          <svg viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Полноэкранный плеер -->
  <section class="fullscreen" id="fs" hidden>
    <!-- живой фон: размытые копии обложки медленно плывут и вращаются -->
    <div class="fs-bg" id="fs-bg" aria-hidden="true">
      <div class="fs-bg-layer l1"></div>
      <div class="fs-bg-layer l2"></div>
      <div class="fs-bg-layer l3"></div>
      <div class="fs-bg-shade"></div>
      <div class="fs-pulse"></div>
    </div>
    <div class="fs-top drag">
      <div class="fs-grabber" id="fs-grabber" title="Потяните вниз, чтобы свернуть"></div>
      <button class="icon-btn fs-close" id="fs-close" title="Свернуть (Esc)">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="icon-btn fs-immersive" id="fs-immersive" title="Только плеер, на весь экран (F11)">
        <svg viewBox="0 0 24 24" class="ic-enter"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg>
        <svg viewBox="0 0 24 24" class="ic-exit"><path d="M9 4v4a1 1 0 0 1-1 1H4M20 9h-4a1 1 0 0 1-1-1V4M15 20v-4a1 1 0 0 1 1-1h4M4 15h4a1 1 0 0 1 1 1v4"/></svg>
      </button>
      <div class="fs-tabs" role="tablist" id="fs-tabs">
        <span class="fs-tab-ind" id="fs-tab-ind"></span>
        <button class="fs-tab" data-fs-tab="cover" role="tab" title="Только обложка">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M4 16l4.5-4.5a1.5 1.5 0 0 1 2.1 0L16 17M14 14l1.5-1.5a1.5 1.5 0 0 1 2.1 0L20 15"/><circle cx="15.5" cy="8.5" r="1.5" class="fill"/></svg>
          <span>Обложка</span>
        </button>
        <button class="fs-tab" data-fs-tab="lyrics" role="tab" title="Текст песни">
          <svg viewBox="0 0 24 24"><path d="M5 6h14M5 10.5h10M5 15h12M5 19.5h7"/></svg>
          <span>Текст</span>
        </button>
        <button class="fs-tab" data-fs-tab="queue" role="tab" title="Очередь">
          <svg viewBox="0 0 24 24"><path d="M4 6h11M4 11h11M4 16h7"/><path class="fill" d="M15.5 13.5l5 3-5 3z"/></svg>
          <span>Далее</span>
        </button>
      </div>
    </div>
    <div class="fs-body">
      <div class="fs-main">
        <div class="fs-cover" id="fs-cover"><img alt=""></div>
        <div class="fs-info">
          <div class="fs-title-row">
            <div class="fs-titles">
              <div class="fs-title" id="fs-title"></div>
              <div class="fs-artist" id="fs-artist"></div>
            </div>
            <div class="fs-actions">
              <span class="uncensored-badge" id="uncensored-badge" hidden title="Играет версия без цензуры">18+</span>
              <button class="icon-btn add-btn" data-act="add" title="Добавить в Мои аудио"><svg viewBox="0 0 24 24" class="ic-add"><path d="M12 5v14M5 12h14"/></svg><svg viewBox="0 0 24 24" class="ic-added"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
              <button class="icon-btn" data-act="download" title="Скачать трек"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/></svg></button>
            </div>
          </div>
        </div>
        <div class="progress fs-progress">
          <span class="time" data-bind="pos">0:00</span>
          <input type="range" class="seek" min="0" max="1000" value="0" aria-label="Перемотка">
          <span class="time" data-bind="dur">0:00</span>
        </div>
        <div class="controls fs-controls">
          <button class="icon-btn toggle" data-act="shuffle" title="Перемешать">
            <svg viewBox="0 0 24 24"><path d="M3 17h3c5 0 6-10 11-10h3.5M3 7h3c5 0 6 10 11 10h3.5"/><path d="M18 4.5l2.5 2.5L18 9.5M18 14.5l2.5 2.5-2.5 2.5"/></svg>
          </button>
          <button class="icon-btn big" data-act="prev" title="Предыдущий">
            <svg viewBox="0 0 24 24"><path class="fill" d="M19 5L8.5 12 19 19z"/><rect class="fill" x="4.9" y="5" width="2.6" height="14" rx="1.2"/></svg>
          </button>
          <button class="play big" data-act="toggle" title="Играть / пауза">
            <svg viewBox="0 0 24 24" class="icon-play"><path class="fill" d="M8 5l11.5 7L8 19z"/></svg>
            <svg viewBox="0 0 24 24" class="icon-pause"><rect class="fill" x="6" y="5" width="4" height="14" rx="1.2"/><rect class="fill" x="14" y="5" width="4" height="14" rx="1.2"/></svg>
          </button>
          <button class="icon-btn big" data-act="next" title="Следующий">
            <svg viewBox="0 0 24 24"><path class="fill" d="M5 5l10.5 7L5 19z"/><rect class="fill" x="16.5" y="5" width="2.6" height="14" rx="1.2"/></svg>
          </button>
          <button class="icon-btn toggle repeat" data-act="repeat" title="Повтор">
            <svg viewBox="0 0 24 24"><path d="M4 12v-1.5A3.5 3.5 0 0 1 7.5 7h12M17 4.5L19.5 7 17 9.5M20 12v1.5a3.5 3.5 0 0 1-3.5 3.5h-12M7 14.5L4.5 17 7 19.5"/></svg>
            <span class="repeat-one">1</span>
          </button>
        </div>
        <div class="volume fs-volume">
          <button class="icon-btn mute" title="Без звука">
            <svg viewBox="0 0 24 24" class="vol-on"><path class="fill" d="M3.5 9h4l5-4.5v15l-5-4.5h-4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>
            <svg viewBox="0 0 24 24" class="vol-off"><path class="fill" d="M3.5 9h4l5-4.5v15l-5-4.5h-4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
          </button>
          <input type="range" class="vol" min="0" max="100" value="80" aria-label="Громкость">
        </div>
      </div>
      <div class="fs-panel" id="fs-panel">
        <div class="fs-lyrics" id="fs-lyrics" data-fs-pane="lyrics"></div>
        <div class="fs-queue-list" id="fs-queue" data-fs-pane="queue" hidden></div>
      </div>
    </div>
  </section>

  <!-- Вход: здесь показывается официальная страница входа ВК -->
  <div class="login-modal" id="login-modal" hidden>
    <div class="login-card glass">
      <div class="login-head">
        <div>
          <div class="login-title">Вход во ВКонтакте</div>
          <div class="login-sub">Официальная страница ВК. Пароль вводится только там.</div>
        </div>
        <button class="icon-btn" id="login-close" title="Закрыть">
          <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
      <div class="login-slot" id="login-slot"></div>
    </div>
  </div>

  <!-- Эквалайзер -->
  <div class="eq-panel" id="eq-panel" hidden>
    <div class="eq-head">
      <div class="eq-title">Эквалайзер</div>
      <label class="switch" title="Включить эквалайзер"><input type="checkbox" id="eq-on"><span></span></label>
    </div>
    <div class="eq-presets" id="eq-presets"></div>
    <div class="eq-bands" id="eq-bands"></div>
    <div class="eq-foot">
      <label class="switch-row"><span>Подменять зацензуренные треки оригиналом</span><span class="switch"><input type="checkbox" id="uncensor-on"><span></span></span></label>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="vendor/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
