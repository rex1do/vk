<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'">
  <title>VK Player</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <!-- Фон: размытая обложка текущего трека -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient-layer" id="ambient-a"></div>
    <div class="ambient-layer" id="ambient-b"></div>
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
    <div class="ambient-shade"></div>
  </div>

  <div class="app">
    <header class="titlebar drag">
      <div class="brand">
        <img src="../build/icon.png" alt="" class="brand-icon">
        <span class="label">VK Player</span>
      </div>
      <div class="history">
        <button class="icon-btn" id="back" title="Назад (Alt+←)">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="icon-btn" id="forward" title="Вперёд (Alt+→)">
          <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <form class="search glass" id="search-form">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
        <input id="search" type="search" placeholder="Трек, артист, альбом" autocomplete="off" spellcheck="false">
      </form>
      <div class="spinner" id="spinner"></div>
      <div class="window-buttons" id="window-buttons">
        <button class="win-btn" data-window="minimize" title="Свернуть">
          <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
        </button>
        <button class="win-btn" data-window="maximize" title="Развернуть">
          <svg viewBox="0 0 24 24" class="max-icon"><rect x="6" y="6" width="12" height="12" rx="3"/></svg>
          <svg viewBox="0 0 24 24" class="restore-icon"><rect x="5" y="9" width="10" height="10" rx="2.5"/><path d="M9 6.5V6a1 1 0 0 1 1-1h7.5A1.5 1.5 0 0 1 19 6.5V14a1 1 0 0 1-1 1h-.5"/></svg>
        </button>
        <button class="win-btn close" data-window="close" title="Закрыть (свернуть в трей)">
          <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
    </header>

    <aside class="sidebar glass">
      <nav>
        <button class="item" data-section="home" title="Главная">
          <svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5V20h-5v-5h-6v5H4z"/></svg><span class="label">Главная</span>
        </button>
        <button class="item" data-section="my" title="Моя музыка">
          <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span class="label">Моя музыка</span>
        </button>
        <button class="item" data-section="recoms" title="Рекомендации">
          <svg viewBox="0 0 24 24"><path class="fill" d="M11 3q1 7 8 8q-7 1-8 8q-1-7-8-8q7-1 8-8z"/></svg><span class="label">Рекомендации</span>
        </button>
        <button class="item" data-section="playlists" title="Плейлисты">
          <svg viewBox="0 0 24 24"><path d="M4 6h12M4 11h12M4 16h7"/><path class="fill" d="M14.5 13.5l6 3.5-6 3.5z"/></svg><span class="label">Плейлисты</span>
        </button>
        <div class="divider"></div>
        <button class="item" data-section="chart" title="Чарт">
          <svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-9"/></svg><span class="label">Чарт</span>
        </button>
        <button class="item" data-section="new" title="Новинки">
          <svg viewBox="0 0 24 24"><path d="M12 4v4M12 16v4M4 12h4M16 12h4M6.3 6.3l2.8 2.8M14.9 14.9l2.8 2.8M6.3 17.7l2.8-2.8M14.9 9.1l2.8-2.8"/></svg><span class="label">Новинки</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <button class="item login-item" id="login-btn" title="Войти во ВКонтакте" hidden>
          <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></svg><span class="label">Войти во ВКонтакте</span>
        </button>
      </div>
    </aside>

    <!-- Сюда основной процесс ставит страницу ВК -->
    <main class="stage glass" id="stage">
      <div class="stage-loading" id="stage-loading">
        <div class="spinner on"></div>
      </div>
    </main>

    <footer class="player glass idle" id="player">
      <div class="track">
        <div class="cover" id="cover">
          <svg viewBox="0 0 24 24" class="cover-empty"><path d="M9.5 17.5V6l10-2v11.5"/><circle cx="7" cy="17.5" r="2.6" class="fill"/><circle cx="17" cy="15.5" r="2.6" class="fill"/></svg>
          <img id="cover-img" alt="">
        </div>
        <div class="meta">
          <div class="title" id="now-title">Ничего не играет</div>
          <div class="artist" id="now-artist">Выберите трек</div>
        </div>
      </div>

      <div class="center">
        <div class="controls">
          <button class="icon-btn ctl" data-media="previoustrack" title="Предыдущий">
            <svg viewBox="0 0 24 24"><path class="fill" d="M19 5L8.5 12 19 19z"/><rect class="fill" x="4.9" y="5" width="2.6" height="14" rx="1.2"/></svg>
          </button>
          <button class="play" data-media="toggle" title="Играть / пауза (Ctrl+P)">
            <svg viewBox="0 0 24 24" class="icon-play"><path class="fill" d="M8 5l11.5 7L8 19z"/></svg>
            <svg viewBox="0 0 24 24" class="icon-pause"><rect class="fill" x="6" y="5" width="4" height="14" rx="1.2"/><rect class="fill" x="14" y="5" width="4" height="14" rx="1.2"/></svg>
          </button>
          <button class="icon-btn ctl" data-media="nexttrack" title="Следующий">
            <svg viewBox="0 0 24 24"><path class="fill" d="M5 5l10.5 7L5 19z"/><rect class="fill" x="16.5" y="5" width="2.6" height="14" rx="1.2"/></svg>
          </button>
        </div>
        <div class="progress">
          <span class="time" id="pos">0:00</span>
          <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Перемотка">
          <span class="time" id="dur">0:00</span>
        </div>
      </div>

      <div class="volume">
        <button class="icon-btn" id="mute" title="Без звука">
          <svg viewBox="0 0 24 24" class="vol-on"><path class="fill" d="M3.5 9h4l5-4.5v15l-5-4.5h-4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>
          <svg viewBox="0 0 24 24" class="vol-off"><path class="fill" d="M3.5 9h4l5-4.5v15l-5-4.5h-4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        </button>
        <input type="range" id="volume" min="0" max="100" value="100" aria-label="Громкость">
      </div>
    </footer>
  </div>

  <script src="shell.js"></script>
</body>
</html>
